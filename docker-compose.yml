services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_NUM_CTX:-4096}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  inngest:
    image: inngest/inngest:latest
    ports:
      - "8288:8288"
    command: >
      inngest dev
      --host 0.0.0.0
      --port 8288
      --sdk-url http://worker:3000/api/inngest
    depends_on:
      - redis

  worker:
    build:
      context: ./app/worker
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      inngest:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b}
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_APP_ID: bosmart-worker
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-dev-key}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-nomic-embed-text}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      SKIP_ANALYSIS: ${SKIP_ANALYSIS:-true}
      SKIP_SYNTHESIS_AGENT: ${SKIP_SYNTHESIS_AGENT:-true}
      NETWORK_MIN_SOURCES: ${NETWORK_MIN_SOURCES:-1}
      NETWORK_MIN_EVIDENCE: ${NETWORK_MIN_EVIDENCE:-1}
      NETWORK_MIN_CLAIMS: ${NETWORK_MIN_CLAIMS:-1}
      NETWORK_MAX_ANALYSIS_ITERS: ${NETWORK_MAX_ANALYSIS_ITERS:-1}
      NETWORK_MAX_CALLS: ${NETWORK_MAX_CALLS:-6}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-4}
      MAX_FETCHES: ${MAX_FETCHES:-2}
      MAX_SEARCH_QUERIES: ${MAX_SEARCH_QUERIES:-1}
      MAX_WALL_CLOCK_MS: ${MAX_WALL_CLOCK_MS:-240000}
      SYNTHESIS_TIMEOUT_MS: ${SYNTHESIS_TIMEOUT_MS:-240000}
      MAX_TOKENS_PER_CALL: ${MAX_TOKENS_PER_CALL:-450}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1h}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      DENIED_DOMAINS: ${DENIED_DOMAINS:-}
    ports:
      - "3000:3000"

  flask:
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      inngest:
        condition: service_started
    environment:
      ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b}
      INNGEST_APP_ID: bosmart-flask
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-dev-key}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      flask:
        condition: service_healthy
    environment:
      NODE_ENV: production
      FLASK_INTERNAL_URL: http://flask:8080
      APP_ENV: ${APP_ENV:-dev}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5:7b}
      INNGEST_DASHBOARD_URL: ${INNGEST_DASHBOARD_URL:-http://localhost:8288}
    ports:
      - "3001:3001"

volumes:
  ollama:
