name: Worker Typecheck

on:
  push:
    branches: [main]
    paths:
      - 'app/worker/**'
      - '.github/workflows/lint-node.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/worker/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/worker
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/worker/package-lock.json'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
