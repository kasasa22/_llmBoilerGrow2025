name: Evaluation harness

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to hit (defaults to secrets.EVAL_URL)'
        required: false
      fail_under:
        description: 'Fail if mean citations_from_expected_domains < this'
        required: false
        default: '0.5'

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'eval/requirements.txt'

      - name: Install eval deps
        run: python -m pip install -r eval/requirements.txt

      - name: Run eval
        env:
          EVAL_URL: ${{ inputs.url || secrets.EVAL_URL }}
          EVAL_FAIL_UNDER: ${{ inputs.fail_under }}
        run: |
          mkdir -p eval/results
          python eval/run_eval.py \
            --url "$EVAL_URL" \
            --dataset eval/dataset.jsonl \
            --out eval/results/$(date -u +%F).md \
            --fail-under "$EVAL_FAIL_UNDER"

      - name: Publish report to job summary
        if: always()
        run: |
          latest=$(ls -1 eval/results/*.md | tail -n1)
          if [ -n "$latest" ]; then
            {
              echo '## Evaluation report'
              echo ''
              cat "$latest"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/*.md
          if-no-files-found: warn
          retention-days: 30
