name: Python Linting

on:
  push:
    branches: [main]
    paths:
      - 'app/**/*.py'
      - '.github/workflows/lint-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**/*.py'

jobs:
  flake8-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install flake8
        run: python -m pip install --quiet flake8
      - name: Run flake8 (critical only)
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
