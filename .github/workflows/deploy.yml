name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      force_replace_cluster:
        description: 'Destroy and recreate the Civo cluster (use when changing node pool size)'
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  TF_VAR_civo_token: ${{ secrets.CIVO_TOKEN }}
  TF_VAR_inngest_event_key: ${{ secrets.INNGEST_EVENT_KEY }}
  TF_VAR_inngest_signing_key: ${{ secrets.INNGEST_SIGNING_KEY }}
  TF_VAR_tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
  TF_VAR_enable_gpu: ${{ vars.ENABLE_GPU || 'true' }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Compute lowercase repo owner
        id: owner
        run: echo "repo_owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.repo_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Flask app image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.repo_owner }}/llm-boilerplate-app:${{ github.sha }}
            ghcr.io/${{ env.repo_owner }}/llm-boilerplate-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./app/worker
          file: ./app/worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.repo_owner }}/llm-boilerplate-worker:${{ github.sha }}
            ghcr.io/${{ env.repo_owner }}/llm-boilerplate-worker:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build & push Next.js web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.repo_owner }}/llm-boilerplate-web:${{ github.sha }}
            ghcr.io/${{ env.repo_owner }}/llm-boilerplate-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=infra/tf/ init -upgrade

      - name: Terraform Plan
        env:
          TF_VAR_app_image_repository: ghcr.io/${{ env.repo_owner }}/llm-boilerplate-app
          TF_VAR_app_image_tag: ${{ github.sha }}
          TF_VAR_worker_image_repository: ghcr.io/${{ env.repo_owner }}/llm-boilerplate-worker
          TF_VAR_worker_image_tag: ${{ github.sha }}
          TF_VAR_web_image_repository: ghcr.io/${{ env.repo_owner }}/llm-boilerplate-web
          TF_VAR_web_image_tag: ${{ github.sha }}
        run: terraform -chdir=infra/tf/ plan -no-color -refresh=false -out=tfplan
        continue-on-error: true

      - name: Terraform Apply
        env:
          TF_VAR_app_image_repository: ghcr.io/${{ env.repo_owner }}/llm-boilerplate-app
          TF_VAR_app_image_tag: ${{ github.sha }}
          TF_VAR_worker_image_repository: ghcr.io/${{ env.repo_owner }}/llm-boilerplate-worker
          TF_VAR_worker_image_tag: ${{ github.sha }}
          TF_VAR_web_image_repository: ghcr.io/${{ env.repo_owner }}/llm-boilerplate-web
          TF_VAR_web_image_tag: ${{ github.sha }}
        run: |
          REPLACE=""
          if [ "${{ inputs.force_replace_cluster }}" = "true" ]; then
            REPLACE="-replace=civo_kubernetes_cluster.cluster"
            echo "::warning::force_replace_cluster=true — cluster will be destroyed and recreated"
          fi
          terraform -chdir=infra/tf/ apply -auto-approve -refresh=false $REPLACE

      - name: Publish outputs to step summary
        if: always()
        run: |
          {
            echo "## Terraform outputs"
            echo ''
            echo '```json'
            terraform -chdir=infra/tf/ output -json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
