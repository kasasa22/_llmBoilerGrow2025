replicaCount: 1

image:
  repository: ghcr.io/kasasa22/llm-boilerplate-worker
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  requests:
    cpu: "200m"
    memory: "384Mi"
  limits:
    cpu: "1000m"
    memory: "768Mi"

env:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  OLLAMA_BASE_URL: "http://ollama.ollama.svc.cluster.local:11434"
  MODEL_NAME: "qwen2.5:3b"
  OLLAMA_KEEP_ALIVE: "30m"
  OLLAMA_NUM_CTX: "4096"
  WORKER_CONCURRENCY: "1"
  REDIS_URL: "redis://redis-master.data.svc.cluster.local:6379/0"
  INNGEST_APP_ID: "bosmart-worker"
  INNGEST_BASE_URL: "http://inngest.inngest.svc.cluster.local:8288"

  NETWORK_MAX_CALLS: "6"
  NETWORK_MIN_SOURCES: "1"
  NETWORK_MIN_EVIDENCE: "1"
  NETWORK_MIN_CLAIMS: "1"
  NETWORK_MAX_ANALYSIS_ITERS: "1"
  SKIP_ANALYSIS: "true"
  SKIP_SYNTHESIS_AGENT: "true"

  RAG_ENABLED: "true"
  RAG_EMBED_MODEL: "nomic-embed-text"
  RAG_TOP_K: "4"

  MAX_TOOL_CALLS: "4"
  MAX_FETCHES: "2"
  MAX_SEARCH_QUERIES: "1"
  MAX_CONTEXT_CHARS: "12000"
  MAX_WALL_CLOCK_MS: "240000"
  SYNTHESIS_TIMEOUT_MS: "240000"
  MAX_TOKENS_PER_CALL: "450"

  ALLOWED_DOMAINS: ""
  DENIED_DOMAINS: ""

secrets:
  INNGEST_EVENT_KEY: ""
  INNGEST_SIGNING_KEY: ""
  TAVILY_API_KEY: ""
