ollama:
  gpu:
    # -- Enable GPU integration
    enabled: true
    # -- Specify the number of GPU to 1
    number: 1

# Keep the chat + embedding models resident between requests so the first
# query of a session does not pay the model load cost. Ollama's default is 5m.
# One parallel slot + a fixed context length keep the KV prefix cache warm
# across the agent's turns, which matters a lot on CPU nodes.
extraEnv:
  - name: OLLAMA_KEEP_ALIVE
    value: "1h"
  - name: OLLAMA_NUM_PARALLEL
    value: "1"
  - name: OLLAMA_CONTEXT_LENGTH
    value: "4096"

persistentVolume:
  enabled: true
  size: 100Gi
